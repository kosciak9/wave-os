name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-validate:
    name: nix-validate
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          installCommand: nix profile add github:NixOS/nixpkgs/34ab99075ac4f7e40cf037eef32cb1c360bb85e9#cachix
      - name: Install devenv
        run: nix profile add github:NixOS/nixpkgs/34ab99075ac4f7e40cf037eef32cb1c360bb85e9#devenv
      - name: Run nix-check
        run: devenv shell -- nix-check
      - name: Run nix-eval jayce
        run: devenv shell -- nix-eval jayce
      - name: Run nix-eval renekton
        run: devenv shell -- nix-eval renekton
      - name: Run nix-eval ahri
        run: devenv shell -- nix-eval ahri
      - name: Run nix-eval zilean
        run: devenv shell -- nix-eval zilean

  jayce-build:
    name: jayce-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build patched desktop packages
        uses: ./.github/actions/build-jayce

  jayce-cache:
    name: jayce-cache
    if: github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-jayce-cache-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    environment: cachix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build patched desktop packages
        uses: ./.github/actions/build-jayce
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Publish a bounded runtime closure
        run: |
          bytes=$(nix path-info --json --recursive ./jayce-cache | jq '[.[].narSize] | add')
          limit=$((512 * 1024 * 1024))
          echo "Selected runtime closure: $bytes bytes; publishing budget: $limit bytes" >> "$GITHUB_STEP_SUMMARY"
          if ((bytes > limit)); then
            echo "::warning::Builds passed; skipping cache upload because the runtime closure exceeds 512 MiB."
            exit 0
          fi
          cachix push wave-os ./jayce-cache
          cachix pin wave-os jayce-current "$(readlink -f ./jayce-cache)" --keep-revisions 1

  ahri-build:
    name: ahri-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ahri
        uses: ./.github/actions/build-ahri

  ahri-cache:
    name: ahri-cache
    if: github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-ahri-cache-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    # The cache token lives here; the environment admits only main.
    environment: cachix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ahri
        uses: ./.github/actions/build-ahri
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Push ahri's runtime closure
        run: |
          cachix push wave-os ./ahri
          cachix pin wave-os ahri-current "$(readlink -f ./ahri)" --keep-revisions 1

  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          installCommand: nix profile add github:NixOS/nixpkgs/34ab99075ac4f7e40cf037eef32cb1c360bb85e9#cachix
      - name: Install devenv
        run: nix profile add github:NixOS/nixpkgs/34ab99075ac4f7e40cf037eef32cb1c360bb85e9#devenv
      - name: Run betterleaks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            devenv shell -- betterleaks git . --log-opts="--full-history ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --ignore-gitleaks-allow
          else
            devenv shell -- betterleaks git . --redact --ignore-gitleaks-allow
          fi
