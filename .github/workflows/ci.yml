name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-validate:
    name: nix-validate
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Configure devenv cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          installCommand: nix profile add github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010#cachix
      - name: Install devenv
        run: nix profile add github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010#devenv
      - name: Run nix-check
        run: devenv shell -- nix-check
      - name: Run nix-eval all
        run: devenv shell -- nix-eval all

  ahri-build:
    name: ahri-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ahri
        uses: ./.github/actions/build-ahri

  ahri-cache:
    name: ahri-cache
    if: github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-ahri-cache-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    # The cache token lives here; the environment admits only main.
    environment: cachix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ahri
        uses: ./.github/actions/build-ahri
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Push ahri's runtime closure
        run: |
          cachix push wave-os ./ahri
          cachix pin wave-os ahri-current "$(readlink -f ./ahri)" --keep-revisions 1

  zac-build:
    name: zac-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross-build zac
        uses: ./.github/actions/build-zac
      - name: Upload SD image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zac-sd-image
          path: zac-cache/image/sd-image/*.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  zac-cache:
    name: zac-cache
    if: github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-zac-cache-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    environment: cachix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross-build zac
        uses: ./.github/actions/build-zac
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Publish system, image and native player checks
        run: |
          cachix push wave-os ./zac-cache
          cachix pin wave-os zac-current "$(readlink -f ./zac-cache)" --keep-revisions 1
      - name: Upload SD image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zac-sd-image
          path: zac-cache/image/sd-image/*.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Configure devenv cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          installCommand: nix profile add github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010#cachix
      - name: Install devenv
        run: nix profile add github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010#devenv
      - name: Run betterleaks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            devenv shell -- betterleaks git . --log-opts="--full-history ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --ignore-gitleaks-allow
          else
            devenv shell -- betterleaks git . --redact --ignore-gitleaks-allow
          fi
