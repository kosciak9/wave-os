name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-validate:
    name: nix-validate
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run nix-check
        run: devenv shell -- nix-check
      - name: Run nix-eval jayce
        run: devenv shell -- nix-eval jayce
      - name: Run nix-eval renekton
        run: devenv shell -- nix-eval renekton
