name: Build ahri
description: Build ahri's system closure, substituting from the wave-os cache.
inputs:
  cachix-auth-token:
    description: Token for pushing to the wave-os cache; pull-only when empty.
    default: ""
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
    - name: Configure Wave cache
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: wave-os
        authToken: ${{ inputs.cachix-auth-token }}
        # Only the runtime closure is pushed; build-only inputs would fill the cache.
        skipPush: true
        installCommand: nix profile add github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010#cachix
    - name: Build ahri
      shell: bash
      run: nix build --out-link ahri --print-build-logs .#nixosConfigurations.ahri.config.system.build.toplevel
